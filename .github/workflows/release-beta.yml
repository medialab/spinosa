# Beta release — tag-triggered, fully built in CI.
#
# The tag push IS the release approval (v* pushes are maintainer-restricted).
# Pipeline: validate → build ×4 → assemble → verify ×4 → publish + channel.
# Publish is gated behind verify: beta.19 shipped broken before this gate.
#
# Test workflow changes first — dry-run proves everything but publish:
#   gh workflow run release-beta.yml -f version=X.Y.Z -f dry_run=true

name: Beta release

on:
  push:
    tags:
      - "v1.1.0-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 1.1.0-beta.22)"
        required: true
      dry_run:
        description: "Build + verify only, skip publish/channel"
        type: boolean
        default: true

# No top-level write permissions: only publish gets write/attestations/id-token.
permissions:
  contents: read

concurrency:
  group: release-beta
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUN_VERSION: "1.3.14"

jobs:
  validate:
    name: Validate tag + quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun scripts/release/validate-tag.ts "${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}"

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats

      - run: bun run quality

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: >
          bun scripts/build-release-binaries.ts
          --out-dir "dist/v${{ needs.validate.outputs.version }}"
          --version "${{ needs.validate.outputs.version }}"
          --channel beta
          --only "${{ matrix.target }}"
          --skip-install

      - run: bash scripts/smoke-native-binary.sh "dist/v${{ needs.validate.outputs.version }}/spinosa-${{ matrix.target }}" 3

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: dist/v${{ needs.validate.outputs.version }}/spinosa-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  assemble:
    name: Assemble (no publish)
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/v${{ needs.validate.outputs.version }}

      - run: |
          bun scripts/build-release-binaries.ts \
            --out-dir "dist/v${{ needs.validate.outputs.version }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --channel beta \
            --manifest-only
          if [ "${{ needs.validate.outputs.dry_run }}" = "true" ]; then
            bun run release ci-assemble "v${{ needs.validate.outputs.version }}" --dry-run
          else
            bun run release ci-assemble "v${{ needs.validate.outputs.version }}" --finalize-only
          fi

      - uses: actions/upload-artifact@v5
        with:
          # Both dist/v<version>/ and dist/beta/ — ci-publish needs the channel installer.
          # Uploaded in dry runs too: verify downloads it to prove the full pipeline.
          name: assembled-dist
          path: dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify:
    name: Verify ${{ matrix.target }}
    needs: [validate, assemble]
    permissions:
      contents: read
    strategy:
      # Never fail fast: a release decision needs all four verdicts.
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: actions/download-artifact@v5
        with:
          name: assembled-dist
          # Artifact root holds dist/ contents, so download into dist/.
          path: dist

      - run: |
          cd "dist/v${{ needs.validate.outputs.version }}"
          grep " spinosa-${{ matrix.target }}$" checksums.txt | shasum -a 256 -c -
          bash "$GITHUB_WORKSPACE/scripts/smoke-native-binary.sh" "./spinosa-${{ matrix.target }}" 5

      # Full installer smoke on every matrix host (not just direct binary
      # execution): serves the assembled dist over loopback HTTP and runs the
      # real install.sh end-to-end (checksum → version → template gates →
      # binary smokes → activation) into an isolated HOME. Catches
      # installer-shell regressions on the actual target OS/arch.
      - run: |
          DIST="dist/v${{ needs.validate.outputs.version }}"
          python3 -m http.server 8931 --directory "$DIST" >/tmp/spinosa-dist-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          SMOKE_HOME="$(mktemp -d)"
          HOME="$SMOKE_HOME" SPINOSA_HOME="$SMOKE_HOME/.spinosa" \
            SPINOSA_RELEASE_BASE_URL="http://127.0.0.1:8931" \
            bash "$DIST/install.sh" --yes --no-launch
          test -x "$SMOKE_HOME/.spinosa/bin/spinosa"
          "$SMOKE_HOME/.spinosa/bin/spinosa" version
          kill $SERVER_PID 2>/dev/null || true
          rm -rf "$SMOKE_HOME"

  publish:
    name: Publish + roll beta channel
    needs: [validate, assemble, verify]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v5
        with:
          name: assembled-dist
          path: dist

      - run: bun run release ci-publish "v${{ needs.validate.outputs.version }}"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/v${{ needs.validate.outputs.version }}/install.sh
            dist/v${{ needs.validate.outputs.version }}/spinosa-darwin-arm64
            dist/v${{ needs.validate.outputs.version }}/spinosa-darwin-x64
            dist/v${{ needs.validate.outputs.version }}/spinosa-linux-arm64
            dist/v${{ needs.validate.outputs.version }}/spinosa-linux-x64
            dist/v${{ needs.validate.outputs.version }}/checksums.txt
            dist/v${{ needs.validate.outputs.version }}/build-manifest.json
