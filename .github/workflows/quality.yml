name: Quality gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Functional quality gate: the same checks that guard a release
  # (typechecks, release-critical + installer tests, shellcheck). Metrics
  # below are advisory hygiene, not release integrity.
  functional-quality:
    name: Functional quality (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install shell/test runners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats

      - name: Run release quality gate
        run: bun run quality
  quality-report:
    name: Reproducible quality report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory hygiene metrics (file length, any/unknown, LOC guardrails) —
    # never blocks merges; release integrity is functional-quality above.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality baseline
        run: bun run quality:report -- --check --output quality-report.json

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: error

  quality-gates:
    name: Coverage and mutation gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage and mutation gates
        shell: bash
        run: |
          set +e
          bun run quality:coverage:check -- --output=quality-coverage.json
          coverage_status=$?
          bun run quality:mutation
          mutation_status=$?
          set -e
          if [ "$coverage_status" -ne 0 ] || [ "$mutation_status" -ne 0 ]; then
            echo "coverage_status=$coverage_status mutation_status=$mutation_status"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-coverage
          path: quality-coverage.json
          if-no-files-found: warn

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-mutation
          path: reports/mutation.json
          if-no-files-found: warn
