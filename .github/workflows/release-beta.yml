# Beta release — tag-triggered, fully built in CI.
#
# The tag push IS the release approval (v* pushes are maintainer-restricted).
# Pipeline: validate → build ×4 → assemble → verify ×4 → publish + channel.
# Publish is gated behind verify: beta.19 shipped broken before this gate.
#
# Division of labor (one runtime verification phase, not stacked gates):
#   validate  source is valid (typechecks, release-critical + installer
#             tests, shellcheck, actionlint, tag/version validation).
#             Functional quality runs on dry-runs; real releases skip it —
#             same commit implies same bytes, already proven.
#   build     each native target compiles (no runtime smoke here)
#   assemble  the release is internally consistent (manifest, installers,
#             checksums, structural validation only — no runtime smoke)
#   verify    the exact artifact users receive installs and runs on every
#             supported platform (checksum + ONE end-to-end installer smoke:
#             version, doctor, native-imports, provider-catalog, pdf-runtime)
#   publish   promotes the EXACT dry-run bytes (no rebuild: downloads the
#             assembled-dist from the green dry-run for the tag commit,
#             re-verifies layout + checksums) and ships them.
#
# Build-once rule: a tag with no green dry-run for its exact commit fails
# closed in publish. Rehearse first:
#   gh workflow run release-beta.yml -f version=X.Y.Z -f dry_run=true
#
# Test workflow changes first — dry-run proves everything but publish:
#   gh workflow run release-beta.yml -f version=X.Y.Z -f dry_run=true

name: Beta release

on:
  push:
    tags:
      - "v1.1.0-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 1.1.0-beta.22)"
        required: true
      dry_run:
        description: "Build + verify only, skip publish/channel"
        type: boolean
        default: true

# No top-level write permissions: only publish gets write/attestations/id-token.
permissions:
  contents: read

concurrency:
  group: release-beta
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUN_VERSION: "1.3.14"

jobs:
  validate:
    name: Validate tag + quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun scripts/release/validate-tag.ts "${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}"

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats
        if: steps.version.outputs.dry_run == 'true'

      # Same commit implies same bytes: real releases skip the functional
      # rerun — the promoted dry-run already proved this tree.
      - run: bun run quality
        if: steps.version.outputs.dry_run == 'true'

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.dry_run == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: >
          bun scripts/build-release-binaries.ts
          --out-dir "dist/v${{ needs.validate.outputs.version }}"
          --version "${{ needs.validate.outputs.version }}"
          --channel beta
          --only "${{ matrix.target }}"
          --skip-install
      # No runtime smoke here by design: the build gate answers "does each
      # native target compile". The assembled artifact is smoked exactly once
      # per platform in verify (full end-to-end installer run).

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/v${{ needs.validate.outputs.version }}/spinosa-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  assemble:
    name: Assemble (no publish)
    needs: [validate, build]
    if: needs.validate.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/v${{ needs.validate.outputs.version }}

      - run: |
          bun scripts/build-release-binaries.ts \
            --out-dir "dist/v${{ needs.validate.outputs.version }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --channel beta \
            --manifest-only
          if [ "${{ needs.validate.outputs.dry_run }}" = "true" ]; then
            bun run release ci-assemble "v${{ needs.validate.outputs.version }}" --dry-run
          else
            bun run release ci-assemble "v${{ needs.validate.outputs.version }}" --finalize-only
          fi

      - uses: actions/upload-artifact@v6
        with:
          # Both dist/v<version>/ and dist/beta/ — ci-publish needs the channel installer.
          # Uploaded in dry runs too: verify downloads it to prove the full pipeline.
          # 90-day retention: real releases promote these exact bytes (see publish).
          name: assembled-dist
          path: dist
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      # Build-commit binding for promotion: dispatch runs report the default
      # branch SHA, not the built beta-dev commit — so the SHA travels inside
      # its own tiny artifact and promote.ts matches on content, not metadata.
      - run: git rev-parse HEAD > dist/commit-sha.txt

      - uses: actions/upload-artifact@v6
        with:
          name: release-sha
          path: dist/commit-sha.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  verify:
    name: Verify ${{ matrix.target }}
    needs: [validate, assemble]
    if: needs.validate.outputs.dry_run == 'true'
    permissions:
      contents: read
    strategy:
      # Never fail fast: a release decision needs all four verdicts.
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # The end-to-end installer smoke carries 400s + 300s gate budgets for
    # slow/cold hosts; 30min keeps headroom without masking a hung install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          name: assembled-dist
          # Artifact root holds dist/ contents, so download into dist/.
          path: dist

      - run: |
          cd "dist/v${{ needs.validate.outputs.version }}"
          grep " spinosa-${{ matrix.target }}$" checksums.txt | shasum -a 256 -c -

      # Full installer smoke on every matrix host (not just direct binary
      # execution): serves the assembled dist over loopback HTTP and runs the
      # real install.sh end-to-end (checksum → version → template gates →
      # binary smokes → activation) into an isolated HOME. Catches
      # installer-shell regressions on the actual target OS/arch.
      - run: |
          DIST="dist/v${{ needs.validate.outputs.version }}"
          # Bypass any runner proxy for loopback: curl honors http_proxy env,
          # which blackholes 127.0.0.1 into 30s connect timeouts (seen on
          # macOS runners while Linux stayed green).
          export no_proxy="127.0.0.1,localhost${no_proxy:+,$no_proxy}"
          export NO_PROXY="$no_proxy"
          env | grep -i "_proxy=" || true
          python3 -m http.server 8931 --bind 127.0.0.1 --directory "$DIST" >/tmp/spinosa-dist-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # Readiness probe: fail fast with the server log instead of letting
          # the installer burn its download budgets against a dead server.
          for _wait in $(seq 1 30); do
            if curl -fsS --noproxy '*' "http://127.0.0.1:8931/checksums.txt" -o /dev/null 2>/dev/null; then
              break
            fi
            if [ "$_wait" -eq 30 ]; then
              echo "loopback dist server never became ready; server log:" >&2
              cat /tmp/spinosa-dist-http.log >&2 || true
              (command -v lsof >/dev/null && lsof -i :8931 >&2) || (command -v netstat >/dev/null && netstat -an >&2 | grep 8931) || true
              exit 1
            fi
            sleep 1
          done
          SMOKE_HOME="$(mktemp -d)"
          HOME="$SMOKE_HOME" SPINOSA_HOME="$SMOKE_HOME/.spinosa" \
            SPINOSA_RELEASE_BASE_URL="http://127.0.0.1:8931" \
            bash "$DIST/install.sh" --yes --no-launch
          test -x "$SMOKE_HOME/.spinosa/bin/spinosa"
          "$SMOKE_HOME/.spinosa/bin/spinosa" version
          kill $SERVER_PID 2>/dev/null || true
          rm -rf "$SMOKE_HOME"

  publish:
    name: Promote + publish + roll beta channel
    needs: [validate]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
      # Cross-run artifact download (promote the dry-run's bytes).
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Build-once: download the assembled-dist from the green dry-run for
      # this exact commit and re-verify layout + checksums. No rebuild —
      # a tag with no green dry-run fails closed here.
      - run: bun scripts/release/promote.ts "${{ needs.validate.outputs.version }}"

      - run: bun run release ci-publish "v${{ needs.validate.outputs.version }}"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/v${{ needs.validate.outputs.version }}/install.sh
            dist/v${{ needs.validate.outputs.version }}/spinosa-darwin-arm64
            dist/v${{ needs.validate.outputs.version }}/spinosa-darwin-x64
            dist/v${{ needs.validate.outputs.version }}/spinosa-linux-arm64
            dist/v${{ needs.validate.outputs.version }}/spinosa-linux-x64
            dist/v${{ needs.validate.outputs.version }}/checksums.txt
            dist/v${{ needs.validate.outputs.version }}/build-manifest.json
