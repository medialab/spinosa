name: Quality measurement

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-report:
    name: Reproducible quality report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality baseline
        run: bun run quality:report -- --check --output quality-report.json

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: error

  quality-gates:
    name: Coverage and mutation gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage and mutation gates
        shell: bash
        run: |
          set +e
          bun run quality:coverage:check -- --output=quality-coverage.json
          coverage_status=$?
          bun run quality:mutation
          mutation_status=$?
          set -e
          if [ "$coverage_status" -ne 0 ] || [ "$mutation_status" -ne 0 ]; then
            echo "coverage_status=$coverage_status mutation_status=$mutation_status"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-coverage
          path: quality-coverage.json
          if-no-files-found: warn

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-mutation
          path: reports/mutation.json
          if-no-files-found: warn
