# Codex subagent role registration for Spinosa
# Bundled adapter configuration; keep agent profiles aligned with .agents/agents/
# Each [agents.<name>] entry wires a TOML agent profile to a named role.
# Model is chosen by the orchestrator at dispatch (see AGENTS.md); not set here.

[agents]
max_threads = 4
max_depth = 1

[agents.spinosa-analyst]
description = "Provides broader contextual analysis as a sequential artifact-producing step in the chain. Challenges assumptions, identifies gaps, and offers alternative framings. "
config_file = "agents/spinosa-analyst.toml"

[agents.spinosa-evaluator]
description = "Audits completed non-fast-path routes, records process-quality findings, and decides whether a tightly scoped framework edit is justified. "
config_file = "agents/spinosa-evaluator.toml"

[agents.spinosa-evolver]
description = "Applies tightly scoped control-file and behavior-doc updates justified by the evaluator's audit, then records what changed for future requests. "
config_file = "agents/spinosa-evolver.toml"

[agents.spinosa-janitor]
description = "Audits repo hygiene, evaluates staleness, and proposes archival moves to .trash/. Requires explicit user confirmation before any move. "
config_file = "agents/spinosa-janitor.toml"

[agents.spinosa-mapper]
description = "Reads raw files in batch and extracts content-grounded fragments. Writes extraction packets and navigation maps; returns file paths to orchestrator. "
config_file = "agents/spinosa-mapper.toml"

[agents.spinosa-overseer]
description = "Session log retrospective and corpus coverage gap detector. Loads the agent-interception skill to read raw Codex/OpenCode session logs, builds file-access maps from actual tool usage, then cross-references against the corpus to identify untouched topics, stale evidence, and underutilized agents. Generates adversarial swarm recommendations for uncovered areas and delivers structured advisories to the orchestrator. "
config_file = "agents/spinosa-overseer.toml"

[agents.spinosa-searcher]
description = "Searches raw corpus, maps, and dictionary for evidence. Writes evidence packets to files; returns file paths to orchestrator. "
config_file = "agents/spinosa-searcher.toml"

[agents.spinosa-serendippo]
description = "Holistic serendipitous research agent. Roams raw files to find hidden connections between concepts across heterogeneous sources. Updates maps with cross-references and discovers patterns that batch processing misses. "
config_file = "agents/spinosa-serendippo.toml"

[agents.spinosa-verifier]
description = "Verifies claims, quotes, and paths against original sources. Corrects errors in-place and never creates new interpretations. "
config_file = "agents/spinosa-verifier.toml"

[agents.spinosa-writer]
description = "Produces user-facing answer reports from prior artifacts in the chain. Does not search or verify; leaves those steps to Searcher and Verifier. "
config_file = "agents/spinosa-writer.toml"
