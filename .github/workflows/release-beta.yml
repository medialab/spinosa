# Beta release — tag-triggered, fully built in CI.
#
# Flow: maintainer prepares beta-dev (merge + CHANGELOG + versions in sync),
# then pushes a greater version tag:
#   git tag v1.1.0-beta.17.18 && git push origin v1.1.0-beta.17.18
# The tag push IS the release approval (tag protection rules restrict v*
# pushes to maintainers). CI validates the tag, builds all four targets
# natively in parallel (each with a native-imports smoke that dlopens the TUI
# natives version/doctor never touch), assembles dist/, verifies every native
# binary, and only then publishes the immutable GitHub release with
# build-provenance attestation and rolls the `beta` channel.
#
# Publishing before native verification shipped v1.1.0-beta.19 broken to the
# default installer — the publish job is gated behind the verify matrix.
#
# workflow_dispatch (dry_run=true default) proves the pipeline without
# publishing — use it after workflow changes before cutting a real tag.

name: Beta release

on:
  push:
    tags:
      - "v1.1.0-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 1.1.0-beta.17.18)"
        required: true
      dry_run:
        description: "Build + verify only, skip publish/channel"
        type: boolean
        default: true

# No top-level write permissions: each job declares the minimum it needs.
# Only the publish job gets contents:write / attestations:write / id-token:write.
permissions:
  contents: read

concurrency:
  group: release-beta
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUN_VERSION: "1.3.14"

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "resolving manual dispatch for version ${{ inputs.version }} (dry_run=${{ inputs.dry_run }})"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "resolving tag push ${GITHUB_REF_NAME} (publishing)"
          fi

  validate:
    name: Validate tag + quality
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out tag (full history for tag comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun scripts/release/validate-tag.ts "v${{ needs.resolve.outputs.version }}"
          else
            bun scripts/release/validate-tag.ts "${{ github.ref_name }}"
          fi

      - name: Install quality prerequisites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita tesseract-ocr-fra
          # Test-only host OCR: repo smoke runs doctor in dev mode against an
          # empty home, so it needs a host tesseract behind the explicit
          # SPINOSA_DEV_HOST_TOOLS=1 override (smoke sets it). Shipped tools
          # still come from pinned-source matrix builds, never from here.

      - name: Release quality gate
        run: bun run quality

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, validate]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install builder toolchain extras
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          else
            brew install ccache
          fi

      - name: Restore pinned sources cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/spinosa-tools-sources
          key: tools-sources-${{ hashFiles('scripts/release/tools-target.ts', 'install.sh') }}
          restore-keys: tools-sources-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/spinosa-ccache
          key: ccache-${{ matrix.target }}-${{ hashFiles('scripts/release/tools-target.ts') }}
          restore-keys: ccache-${{ matrix.target }}-

      - name: Build product binary (${{ matrix.target }})
        shell: bash
        run: >
          bun scripts/build-release-binaries.ts
          --out-dir "dist/v${{ needs.resolve.outputs.version }}"
          --version "${{ needs.resolve.outputs.version }}"
          --channel beta
          --only "${{ matrix.target }}"
          --skip-install

      - name: Build OCR tools tarball (${{ matrix.target }})
        shell: bash
        env:
          CCACHE_DIR: ~/.cache/spinosa-ccache
          CCACHE_MAXSIZE: 2G
        run: >
          bun scripts/build-tools-tarballs.ts
          --out-dir "dist/v${{ needs.resolve.outputs.version }}"
          --only "${{ matrix.target }}"
          --reuse-previous
          --sources-dir ~/.cache/spinosa-tools-sources

      # Native gate at the source: version/doctor never dlopen the TUI
      # natives. A corrupt embedded Mach-O (beta.18/beta.19) passes version
      # and dies on TUI launch — native-imports loads OpenTUI, FFF, watcher,
      # node-pty, and canvas without starting an interactive UI. Fail closed.
      # Doctor runs once against the just-built tools tarball to prove
      # bundled OCR standalone.
      - name: Smoke native binary (${{ matrix.target }})
        shell: bash
        run: |
          BIN="dist/v${{ needs.resolve.outputs.version }}/spinosa-${{ matrix.target }}"
          TOOLS="dist/v${{ needs.resolve.outputs.version }}/spinosa-tools-${{ matrix.target }}.tar.gz"
          chmod +x "$BIN"
          STAGED_HOME="$(mktemp -d /tmp/smoke-home-XXXXXX)"
          mkdir -p "$STAGED_HOME/.spinosa/tools"
          tar -xzf "$TOOLS" -C "$STAGED_HOME/.spinosa/tools"
          HOME="$STAGED_HOME" SPINOSA_HOME="$STAGED_HOME/.spinosa" "$BIN" doctor
          rm -rf "$STAGED_HOME"
          for i in 1 2 3; do
            FRESH_HOME="$(mktemp -d /tmp/smoke-home-XXXXXX)"
            HOME="$FRESH_HOME" SPINOSA_HOME="$FRESH_HOME/.spinosa" \
              "$BIN" version
            HOME="$FRESH_HOME" SPINOSA_HOME="$FRESH_HOME/.spinosa" \
              "$BIN" internal smoke native-imports --json
            rm -rf "$FRESH_HOME"
          done

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/v${{ needs.resolve.outputs.version }}/spinosa-${{ matrix.target }}
            dist/v${{ needs.resolve.outputs.version }}/spinosa-tools-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          # Re-runs of the same run re-upload; without this the second
          # upload fails on the immutable name collision.
          overwrite: true
          retention-days: 7

  assemble:
    name: Assemble (no publish)
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # No environment gate here: the pushed tag itself is the approval
    # (v* pushes are maintainer-restricted by tag protection rules).
    # This job finalizes + locally gates but never publishes — publish runs
    # only after every native verify job passes.
    steps:
      - name: Check out tag (full history for tag verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta-dev' || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/v${{ needs.resolve.outputs.version }}

      - name: Stage template manifest
        shell: bash
        run: >
          bun scripts/build-release-binaries.ts
          --out-dir "dist/v${{ needs.resolve.outputs.version }}"
          --version "${{ needs.resolve.outputs.version }}"
          --channel beta
          --manifest-only

      - name: Assemble + local gates (finalize-only)
        shell: bash
        run: |
          if [ "${{ needs.resolve.outputs.dry_run }}" = "true" ]; then
            bun run release ci-assemble "v${{ needs.resolve.outputs.version }}" --dry-run
          else
            bun run release ci-assemble "v${{ needs.resolve.outputs.version }}" --finalize-only
          fi

      - name: Upload assembled dist
        if: needs.resolve.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          # Both dist/v<version>/ (immutable) and dist/beta/ (channel) —
          # ci-publish needs the channel installer staged by finalize.
          name: assembled-dist
          path: dist
          if-no-files-found: error
          # Same rerun-collision note as the per-target uploads above.
          overwrite: true
          retention-days: 7

  verify:
    name: Verify ${{ matrix.target }}
    needs: [resolve, assemble]
    if: needs.resolve.outputs.dry_run != 'true'
    permissions:
      contents: read
    strategy:
      # Never fail fast here: a release decision needs the verdict from all
      # four natives, not just the first failure.
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Download assembled dist
        uses: actions/download-artifact@v4
        with:
          name: assembled-dist
          # The artifact root holds the *contents* of dist/ (upload strips
          # the top directory), so download into dist/ to reconstruct
          # dist/v<version>/ + dist/beta/.
          path: dist

      - name: Verify checksum + native smoke (${{ matrix.target }})
        shell: bash
        run: |
          cd "dist/v${{ needs.resolve.outputs.version }}"
          grep " spinosa-${{ matrix.target }}$" checksums.txt | shasum -a 256 -c -
          grep " spinosa-tools-${{ matrix.target }}.tar.gz$" checksums.txt | shasum -a 256 -c -
          chmod +x "spinosa-${{ matrix.target }}"
          # The Tahoe SIGKILL is intermittent (a corrupt embedded native
          # sometimes survives one launch), so probe repeatedly with a fresh
          # HOME each time to force re-stage + cold dlopen. Fail closed.
          # First iteration also stages the platform tools tarball and runs
          # doctor, proving bundled OCR standalone (no host-tool fallback).
          STAGED_TOOLS=0
          for i in 1 2 3 4 5; do
            FRESH_HOME="$(mktemp -d /tmp/verify-home-XXXXXX)"
            if [ "$STAGED_TOOLS" -eq 0 ]; then
              mkdir -p "$FRESH_HOME/.spinosa/tools"
              tar -xzf "spinosa-tools-${{ matrix.target }}.tar.gz" -C "$FRESH_HOME/.spinosa/tools"
              HOME="$FRESH_HOME" SPINOSA_HOME="$FRESH_HOME/.spinosa" \
                ./spinosa-${{ matrix.target }} doctor
              STAGED_TOOLS=1
            fi
            HOME="$FRESH_HOME" SPINOSA_HOME="$FRESH_HOME/.spinosa" \
              ./spinosa-${{ matrix.target }} version
            HOME="$FRESH_HOME" SPINOSA_HOME="$FRESH_HOME/.spinosa" \
              ./spinosa-${{ matrix.target }} version --json
            HOME="$FRESH_HOME" SPINOSA_HOME="$FRESH_HOME/.spinosa" \
              ./spinosa-${{ matrix.target }} internal smoke native-imports --json
            rm -rf "$FRESH_HOME"
          done

  publish:
    name: Publish + roll beta channel
    needs: [resolve, assemble, verify]
    if: needs.resolve.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out tag (full history for tag verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download assembled dist
        uses: actions/download-artifact@v4
        with:
          name: assembled-dist
          # Same layout note as the verify jobs: artifact root holds the
          # contents of dist/, so download into dist/.
          path: dist

      - name: Publish immutable release + roll beta channel
        shell: bash
        run: bun run release ci-publish "v${{ needs.resolve.outputs.version }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/v${{ needs.resolve.outputs.version }}/install.sh
            dist/v${{ needs.resolve.outputs.version }}/spinosa-darwin-arm64
            dist/v${{ needs.resolve.outputs.version }}/spinosa-darwin-x64
            dist/v${{ needs.resolve.outputs.version }}/spinosa-linux-arm64
            dist/v${{ needs.resolve.outputs.version }}/spinosa-linux-x64
            dist/v${{ needs.resolve.outputs.version }}/spinosa-tools-darwin-arm64.tar.gz
            dist/v${{ needs.resolve.outputs.version }}/spinosa-tools-darwin-x64.tar.gz
            dist/v${{ needs.resolve.outputs.version }}/spinosa-tools-linux-arm64.tar.gz
            dist/v${{ needs.resolve.outputs.version }}/spinosa-tools-linux-x64.tar.gz
            dist/v${{ needs.resolve.outputs.version }}/checksums.txt
            dist/v${{ needs.resolve.outputs.version }}/build-manifest.json
